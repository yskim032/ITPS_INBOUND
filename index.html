<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITPS Inbound Converter (Serverless)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --accent: #238636;
      --accent2: #1f6feb;
      --red: #da3633;
      --text: #e6edf3;
      --muted: #8b949e;
      --yellow: #ffd700;
      --radius: 12px;
      --glow-green: 0 0 20px rgba(35, 134, 54, .35);
      --glow-blue: 0 0 20px rgba(31, 111, 235, .35);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #238636, #1f6feb);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: var(--glow-green);
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #e6edf3, #8b949e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .copyright {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0.8;
    }

    main {
      display: flex;
      max-width: 1700px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      align-items: flex-start;
    }

    .left-panel {
      flex: 1;
      padding-right: 40px;
      min-width: 0;
      max-width: 650px;
    }

    .neon-divider {
      width: 3px;
      align-self: stretch;
      background: linear-gradient(to bottom, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 100% 400%;
      animation: rainbow-flow 4s linear infinite;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      margin: 0 40px;
      border-radius: 4px;
    }

    @keyframes rainbow-flow {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 0% 100%;
      }
    }

    .right-panel {
      flex: 1.6;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 100px;
    }

    @media (max-width: 1200px) {
      main {
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        max-width: none;
        padding: 0;
      }

      .neon-divider {
        width: 100%;
        height: 3px;
        margin: 20px 0;
      }
    }

    .section-title {
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .drop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      background: var(--surface);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      transition: all .2s ease;
    }

    .drop-zone:hover {
      transform: translateY(-3px);
    }

    .drop-zone.tsteam:hover {
      border-color: var(--accent2);
      box-shadow: var(--glow-blue);
    }

    .drop-zone.itps:hover {
      border-color: var(--accent);
      box-shadow: var(--glow-green);
    }

    .drop-icon {
      font-size: 48px;
      opacity: .8;
    }

    .drop-label {
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .drop-zone.tsteam .drop-label {
      color: #58a6ff;
    }

    .drop-zone.itps .drop-label {
      color: #3fb950;
    }

    .drop-filename {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .drop-zone.tsteam .drop-filename {
      background: rgba(31, 111, 235, .2);
      color: #79c0ff;
    }

    .drop-zone.itps .drop-filename {
      background: rgba(35, 134, 54, .2);
      color: #56d364;
    }

    .clear-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(218, 54, 51, 0.25);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      display: block !important;
      z-index: 20;
    }

    input[type="file"] {
      display: none;
    }

    .process-btn {
      background: linear-gradient(135deg, #238636, #196f2b);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: var(--glow-green);
      margin-bottom: 24px;
    }

    .process-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(35, 134, 54, .5);
    }

    .process-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      animation: slideIn .3s ease;
      margin-bottom: 10px;
    }

    .toast.success {
      background: rgba(35, 134, 54, .15);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, .3);
    }

    .toast.error {
      background: rgba(218, 54, 51, .12);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, .3);
    }

    .toast.show {
      display: block;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .summary-card h2 {
      font-size: 20px;
      color: #79c0ff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-count {
      color: var(--yellow);
      font-weight: 800;
    }

    .table-container {
      overflow-x: auto;
      max-height: 400px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      color: var(--text);
    }

    th {
      background: var(--surface2);
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tr:hover td {
      background: rgba(255, 255, 255, .03);
    }

    .total-row td {
      color: var(--yellow) !important;
      font-weight: 800 !important;
      background: rgba(255, 215, 0, 0.08) !important;
      border-top: 1px solid rgba(255, 215, 0, 0.2);
    }

    .col-krpus {
      color: #ff4444 !important;
      font-weight: 800;
    }

    .col-krkan {
      color: #ff9900 !important;
      font-weight: 800;
    }

    .col-krinc {
      color: #00ee00 !important;
      font-weight: 800;
    }

    .empty-state {
      padding: 60px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-style: italic;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-icon">📦</div>
    <div class="title-wrap">
      <h1>ITPS Inbound Converter</h1>
      <p class="copyright">The End - YS KIM holds the copyright @ 2026</p>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <p class="section-title">파일 업로드 (Drag &amp; Drop)</p>
      <div class="drop-grid">
        <div class="drop-zone tsteam" id="zone-tsteam">
          <button class="clear-btn" id="clear-tsteam" onclick="clearFile('tsteam', event)">✕ 제거</button>
          <div class="drop-icon">📊</div>
          <span class="drop-label">최종파일</span>
          <div class="drop-filename" id="name-tsteam" style="display:none"></div>
          <input type="file" id="file-tsteam" />
        </div>
        <div class="drop-zone itps" id="zone-itps">
          <button class="clear-btn" id="clear-itps" onclick="clearFile('itps', event)">✕ 제거</button>
          <div class="drop-icon">📋</div>
          <span class="drop-label">ITPS 파일</span>
          <div class="drop-filename" id="name-itps" style="display:none"></div>
          <input type="file" id="file-itps" />
        </div>
      </div>
      <div class="action-bar">
        <button class="process-btn" id="process-btn" onclick="processFiles()" disabled>
          <div class="spinner" id="spinner"></div><span class="btn-text" id="btn-text">Merged 파일 생성</span>
        </button>
        <div class="toast" id="toast"></div>
      </div>
    </div>
    <div class="neon-divider"></div>
    <div class="right-panel" id="summary-panel">
      <div class="empty-state">파일을 업로드하고 생성 버튼을 누르면 브라우저 내에서 즉시 처리됩니다.</div>
    </div>
  </main>

  <script>
    const files = { tsteam: null, itps: null };
    const PORT_MAP = {
      'AJMAN': 'AEAJM', 'ABU DHABI': 'AEAUH', 'DUBAI': 'AEDXB', 'AL - FUJAYRAH': 'AEFJR', 'JEBEL ALI': 'AEJEA',
      'KHOR AL FAKKAN': 'AEKLF', 'PORT RASHID': 'AEPRA', 'UMM AL QAIWAIN': 'AEQIW', 'RAS AL KHAIMAH': 'AERKT',
      'SHARJAH': 'AESHJ', 'YAS ISLAND': 'AEYAS', 'ANTIGUA': 'AGANU', 'ROAD BAY': 'AIRBY', 'DURRES': 'ALDRZ',
      'SARANDE': 'ALSAR', 'LUANDA': 'AOLAD', 'LOBITO': 'AOLOB', 'NAMIBE': 'AOMSZ', 'BUENOS AIRES': 'ARBUE',
      'CAMPANA': 'ARCMP', 'LA PLATA': 'ARLPG', 'PUERTO MADRYN': 'ARPMY', 'ROSARIO': 'ARROS', 'USHUAIA': 'ARUSH',
      'ZARATE': 'ARZAE', 'PAGO PAGO': 'ASPPG', 'ABBOT POINT': 'AUABP', 'ADELAIDE': 'AUADL', 'ALBANY': 'AUALH',
      'BRISBANE': 'AUBNE', 'MELBOURNE': 'AUMEL', 'SYDNEY': 'AUSYD', 'FREMANTLE': 'AUFRE', 'KRPUS': 'KRPUS',
      'BUSAN': 'KRPUS', 'INCHEON': 'KRINC', 'KRINC': 'KRINC', 'KWANGYANG': 'KRKAN', 'KRKAN': 'KRKAN'
    };

    const TERMINAL_MAP = {
      'PUSAN NEWPORT INTERNATIONAL TERMINAL-PNIT': 'PNIT',
      'PUSAN NEWPORT COMPANY LIMITED': 'PNC',
      'DONGWON GLOBAL TERMINAL (DGT)': 'DGT',
      'BUSAN CONTAINER TERMINAL - BCT': 'BCT',
      'HANJIN BUSAN NEW PORT CO., LTD': 'HJNC',
      'HMM PSA NEW-PORT TERMINAL (HPNT)': 'HPNT'
    };

    const COLORS = {
      'PNC': '#FFD1DC', 'PNIT': '#BFFCC6', 'BCT': '#D4F0F0',
      'DGT': '#FFECB3', 'HJNC': '#E1BEE7', 'HPNT': '#C5CAE9'
    };

    function setFile(type, file) {
      files[type] = file;
      const zone = document.getElementById(`zone-${type}`);
      const nameEl = document.getElementById(`name-${type}`);
      zone.classList.add('loaded');
      nameEl.textContent = '✓ ' + file.name;
      nameEl.style.display = 'block';
      checkReady();
    }
    function clearFile(type, e) {
      if (e) e.stopPropagation();
      files[type] = null;
      document.getElementById(`zone-${type}`).classList.remove('loaded');
      document.getElementById(`name-${type}`).style.display = 'none';
      checkReady();
    }
    function checkReady() { document.getElementById('process-btn').disabled = !(files.tsteam && files.itps); }

    ['tsteam', 'itps'].forEach(type => {
      const zone = document.getElementById(`zone-${type}`);
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = 'var(--accent)'; });
      zone.addEventListener('dragleave', () => zone.style.borderColor = '');
      zone.addEventListener('drop', e => {
        e.preventDefault(); zone.style.borderColor = '';
        const f = e.dataTransfer.files[0];
        if (f && (f.name.endsWith('.xlsx') || f.name.endsWith('.xls'))) setFile(type, f);
      });
    });

    async function processFiles() {
      const btn = document.getElementById('process-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      btn.disabled = true; spinner.style.display = 'block'; btnText.textContent = '[데이터 처리중]';
      toast('success', '⏳ 브라우저 내 데이터 처리 중...');

      try {
        const tsData = await readExcel(files.tsteam, 'TSTEAM');
        const itData = await readExcel(files.itps, 'Data');

        // Logic Porting
        const merged = performProcessing(tsData, itData);
        const { summary, soc, dg } = generateSummaries(merged);

        renderSummary({ summary, soc, dg });
        downloadExcel(merged, `Inbound_Merged_${new Date().toISOString().slice(0, 10)}.xlsx`);

        toast('success', '✅ 처리 완료 및 다운로드 시작!');
      } catch (err) {
        console.error(err);
        toast('error', '❌ 오류: ' + err.message);
      } finally {
        btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Merged 파일 생성';
      }
    }

    function readExcel(file, sheetName) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[sheetName] || workbook.Sheets[workbook.SheetNames[0]];
          resolve(XLSX.utils.sheet_to_json(sheet));
        };
        reader.readAsArrayBuffer(file);
      });
    }

    function performProcessing(tsData, itData) {
      const tsMap = {};
      tsData.forEach(row => {
        let bl = String(row['B/L NO'] || '');
        if (bl.includes('<')) bl = bl.split('<')[0].trim();
        if (bl) tsMap[bl] = row;
      });

      return itData.map(row => {
        const bl = String(row['B/L No.'] || '');
        const tsRow = tsMap[bl] || {};

        let pod = String(row['Discharge Port'] || '');
        if (PORT_MAP[pod]) pod = PORT_MAP[pod];

        // VGM Handling
        let weight = parseFloat(row['Package Weight'] || 0);
        const unit = String(row['Weight Unit'] || '').toUpperCase();
        if (unit === 'MT') weight *= 1000;
        weight = Math.round(weight * 10) / 10;

        // Terminal Name Mapping
        let terminal = String(tsRow['Loading terminal'] || '');
        Object.keys(TERMINAL_MAP).forEach(k => { if (terminal.includes(k)) terminal = TERMINAL_MAP[k]; });

        // IMO/SOC Remark
        const imo = String(row['IMO Class'] || '');
        const socRem = String(row['SOC Remark'] || '');
        let remark = '';
        if (imo) remark += `IMO ${imo} `;
        if (socRem.toUpperCase().includes('SOC')) remark += 'SOC';

        return {
          'No': row['No'] || '',
          'Terminal': terminal,
          'Container No.': row['Container No.'] || '',
          'Type/Size': row['Type/Size'] || '',
          'Full/Empty': row['Full/Empty'] || '',
          'Package Weight': weight,
          'Discharge Port': pod,
          'B/L No.': bl,
          'Remark': remark.trim(),
          '_terminal': terminal // for sorting
        };
      }).sort((a, b) => {
        if (!a._terminal && !b._terminal) return 0;
        if (!a._terminal) return 1;
        if (!b._terminal) return -1;
        return a._terminal.localeCompare(b._terminal);
      });
    }

    function generateSummaries(data) {
      const counts = {};
      const krPorts = ['KRPUS', 'KRKAN', 'KRINC'];
      const soc = [], dg = [];

      data.forEach(row => {
        const tsSize = row['Type/Size'];
        const pod = row['Discharge Port'];
        const fe = String(row['Full/Empty']).toUpperCase();

        if (!counts[tsSize]) counts[tsSize] = { KRPUS: 0, KRKAN: 0, KRINC: 0, TS: 0, TOTAL: 0, 'TYPE/SIZE': tsSize };

        if (fe !== 'E') {
          if (krPorts.includes(pod)) counts[tsSize][pod]++;
          else counts[tsSize]['TS']++;
        }
        counts[tsSize]['TOTAL']++;

        if (row['Remark'].includes('SOC')) soc.push(row);
        if (row['Remark'].includes('IMO')) dg.push(row);
      });

      const summary = Object.values(counts);
      const totalsRow = { 'TYPE/SIZE': 'Total', KRPUS: 0, KRKAN: 0, KRINC: 0, TS: 0, TOTAL: 0 };
      summary.forEach(s => {
        ['KRPUS', 'KRKAN', 'KRINC', 'TS', 'TOTAL'].forEach(k => totalsRow[k] += s[k]);
      });
      summary.push(totalsRow);

      return { summary, soc, dg };
    }

    function downloadExcel(data, filename) {
      const ws = XLSX.utils.json_to_sheet(data);

      // Styling (using xlsx-js-style)
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let R = range.s.r + 1; R <= range.e.r; ++R) {
        const termCell = ws[XLSX.utils.encode_cell({ c: 1, r: R })]; // Terminal column
        if (termCell && termCell.v && COLORS[termCell.v]) {
          termCell.s = { fill: { fgColor: { rgb: COLORS[termCell.v].replace('#', '') } }, font: { bold: true } };
        }
        const weightCell = ws[XLSX.utils.encode_cell({ c: 5, r: R })]; // Weight
        if (weightCell) weightCell.z = '0.0';
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Merged");
      XlsxPopulate.saveAs(XLSX_STYLE.write(wb, { type: 'buffer' }), filename);
    }

    function downloadExcel(data, filename) {
      // Create Sheet
      const ws = XLSX.utils.json_to_sheet(data);
      // Styling logic
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let r = range.s.r + 1; r <= range.e.r; r++) {
        const terminalIdx = 1; // 'Terminal' column index
        const cellRef = XLSX.utils.encode_cell({ r: r, c: terminalIdx });
        const cell = ws[cellRef];
        if (cell && cell.v && COLORS[cell.v]) {
          cell.s = {
            fill: { fgColor: { rgb: COLORS[cell.v].substring(1) } },
            font: { bold: true }
          };
        }
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Merged");

      // Use xlsx-js-style to write with styles
      const wbout = XLSX_STYLE.write(wb, { bookType: 'xlsx', type: 'binary' });
      function s2ab(s) {
        const buf = new ArrayBuffer(s.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
      }
      const blob = new Blob([s2ab(wbout)], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    }

    function renderSummary(res) {
      const panel = document.getElementById('summary-panel');
      panel.innerHTML = '';
      panel.appendChild(createCard('📊 SUMMARY 정보', res.summary, null, true));
      panel.appendChild(createCard('⚠️ 직반출 위험물 목록', res.dg, res.dg.length));
      panel.appendChild(createCard('👥 SOC 목록', res.soc, res.soc.length));
    }

    function createCard(title, data, count = null, isSummary = false) {
      const card = document.createElement('div'); card.className = 'summary-card';
      const h2 = document.createElement('h2');
      h2.innerHTML = `${title}${count !== null ? ` <span class="header-count">(${count}건)</span>` : ''}`;
      card.appendChild(h2);
      if (!data || data.length === 0) { card.innerHTML += '<p class="empty-state">데이터가 없습니다.</p>'; return card; }
      const wrap = document.createElement('div'); wrap.className = 'table-container';
      const table = document.createElement('table');
      const thead = document.createElement('thead'); const trHeader = document.createElement('tr');

      let keys = Object.keys(data[0]).filter(k => !k.startsWith('_'));
      if (isSummary) keys = ['KRPUS', 'KRKAN', 'KRINC', 'TS', 'TOTAL', 'TYPE/SIZE'];

      keys.forEach(key => {
        const th = document.createElement('th'); th.textContent = key;
        if (isSummary) {
          if (key === 'KRPUS') th.className = 'col-krpus';
          if (key === 'KRKAN') th.className = 'col-krkan';
          if (key === 'KRINC') th.className = 'col-krinc';
        }
        trHeader.appendChild(th);
      });
      thead.appendChild(trHeader); table.appendChild(thead);
      const tbody = document.createElement('tbody');
      data.forEach(row => {
        const tr = document.createElement('tr');
        if (Object.values(row).some(v => String(v).toLowerCase() === 'total')) tr.className = 'total-row';
        keys.forEach(key => {
          const val = row[key]; const td = document.createElement('td');
          td.textContent = (val === null || val === undefined || val === 0) ? '' : val;
          if (isSummary) {
            if (key === 'KRPUS') td.className = 'col-krpus';
            if (key === 'KRKAN') td.className = 'col-krkan';
            if (key === 'KRINC') td.className = 'col-krinc';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody); wrap.appendChild(table); card.appendChild(wrap);
      return card;
    }

    function toast(type, msg) {
      const el = document.getElementById('toast');
      el.className = 'toast show ' + type; el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.classList.remove('show'); }, 5000);
    }
  </script>
</body>
