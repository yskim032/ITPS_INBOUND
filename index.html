<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITPS Inbound Converter (Serverless)</title>
  <meta name="description"
    content="ITPS Inbound 파일을 브라우저에서 변환하는 서버리스 툴. 최종파일과 ITPS 파일을 업로드하면 Merged Excel 파일이 즉시 생성됩니다." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- SheetJS with style support -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --accent: #238636;
      --accent2: #1f6feb;
      --red: #da3633;
      --text: #e6edf3;
      --muted: #8b949e;
      --yellow: #ffd700;
      --radius: 12px;
      --glow-green: 0 0 20px rgba(35, 134, 54, .35);
      --glow-blue: 0 0 20px rgba(31, 111, 235, .35);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #238636, #1f6feb);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: var(--glow-green);
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #e6edf3, #8b949e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .copyright {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: .02em;
      opacity: .8;
    }

    main {
      display: flex;
      max-width: 1700px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      align-items: flex-start;
    }

    .left-panel {
      flex: 0.8;
      padding-right: 40px;
      min-width: 0;
      max-width: 520px;
    }

    .neon-divider {
      width: 3px;
      align-self: stretch;
      background: linear-gradient(to bottom, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 100% 400%;
      animation: rainbow-flow 4s linear infinite;
      box-shadow: 0 0 15px rgba(255, 255, 255, .4);
      margin: 0 40px;
      border-radius: 4px;
    }

    @keyframes rainbow-flow {
      0% {
        background-position: 0% 0%
      }

      100% {
        background-position: 0% 100%
      }
    }

    .right-panel {
      flex: 1.6;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 100px;
    }

    @media(max-width:1200px) {
      main {
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        max-width: none;
        padding: 0;
      }

      .neon-divider {
        width: 100%;
        height: 3px;
        margin: 20px 0;
      }
    }

    .section-title {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .drop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      background: var(--surface);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      transition: all .2s ease;
      cursor: pointer;
    }

    .drop-zone:hover {
      transform: translateY(-3px);
    }

    .drop-zone.tsteam:hover {
      border-color: var(--accent2);
      box-shadow: var(--glow-blue);
    }

    .drop-zone.itps:hover {
      border-color: var(--accent);
      box-shadow: var(--glow-green);
    }

    .drop-zone.loaded {
      border-style: solid;
    }

    .drop-zone.tsteam.loaded {
      border-color: var(--accent2);
    }

    .drop-zone.itps.loaded {
      border-color: var(--accent);
    }

    .drop-icon {
      font-size: 48px;
      opacity: .8;
    }

    .drop-label {
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .drop-zone.tsteam .drop-label {
      color: #58a6ff;
    }

    .drop-zone.itps .drop-label {
      color: #3fb950;
    }

    .drop-hint {
      font-size: 12px;
      color: var(--muted);
    }

    .drop-filename {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
    }

    .drop-zone.tsteam .drop-filename {
      background: rgba(31, 111, 235, .2);
      color: #79c0ff;
    }

    .drop-zone.itps .drop-filename {
      background: rgba(35, 134, 54, .2);
      color: #56d364;
    }

    .clear-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(218, 54, 51, .25);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, .4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      z-index: 20;
    }

    input[type="file"] {
      display: none;
    }

    .clear-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(218, 54, 51, .25);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, .4);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      z-index: 20;
    }

    .process-btn {
      background: linear-gradient(135deg, #238636, #196f2b);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: all .25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: var(--glow-green);
      margin-bottom: 24px;
    }

    .process-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(35, 134, 54, .5);
    }

    .process-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .toast {
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      animation: slideIn .3s ease;
      margin-bottom: 10px;
    }

    .toast.success {
      background: rgba(35, 134, 54, .15);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, .3);
    }

    .toast.error {
      background: rgba(218, 54, 51, .12);
      color: #f85149;
      border: 1px solid rgba(218, 54, 51, .3);
    }

    .toast.show {
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .summary-card h2 {
      font-size: 18px;
      color: #79c0ff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-count {
      color: var(--yellow);
      font-weight: 800;
    }

    .table-container {
      overflow-x: auto;
      max-height: 420px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      color: var(--text);
    }

    th {
      background: var(--surface2);
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tr:hover td {
      background: rgba(255, 255, 255, .03);
    }

    .total-row td {
      color: var(--yellow) !important;
      font-weight: 800 !important;
      background: rgba(255, 215, 0, .08) !important;
      border-top: 1px solid rgba(255, 215, 0, .2);
    }

    .col-krpus {
      color: #ff4444 !important;
      font-weight: 800;
    }

    .col-krkan {
      color: #ff9900 !important;
      font-weight: 800;
    }

    .col-krinc {
      color: #00ee00 !important;
      font-weight: 800;
    }

    .empty-state {
      padding: 60px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-style: italic;
    }

    /* Flow Visualization - Grouped Tree Style */
    .flow-card {
      background: linear-gradient(145deg, rgba(30, 30, 30, 0.4), rgba(15, 15, 15, 0.6));
      overflow: hidden;
    }

    .flow-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 20px 0;
    }

    .flow-group {
      display: flex;
      align-items: center;
      position: relative;
      min-height: 200px;
    }

    .source-side {
      flex: 0 0 120px;
      display: flex;
      justify-content: center;
      z-index: 2;
    }

    .svg-side {
      flex: 1;
      height: 100%;
      position: relative;
      min-width: 200px;
    }

    .destination-side {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 2;
    }

    .flow-node {
      width: 100px;
      height: 50px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .node-label {
      font-size: 8px;
      font-weight: 800;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .node-name {
      font-size: 14px;
      font-weight: 800;
    }

    .dest-node-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dest-info {
      display: flex;
      flex-direction: column;
      font-size: 11px;
    }

    .dest-boxes {
      font-weight: 700;
      color: var(--accent2);
    }

    .dest-teu {
      opacity: 0.6;
    }

    .flow-path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .flow-path-anim {
      fill: none;
      stroke: var(--accent2);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 4 12;
      animation: dash-flow 2s linear infinite;
      filter: drop-shadow(0 0 5px var(--accent2));
    }

    @keyframes dash-flow {
      from {
        stroke-dashoffset: 16;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .moving-light {
      offset-path: var(--path);
      animation: flow-move 3s infinite linear;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 15px #fff, 0 0 30px var(--accent2);
      z-index: 5;
    }

    @keyframes flow-move {
      from {
        offset-distance: 0%;
      }

      to {
        offset-distance: 100%;
      }
    }

    /* terminal color badges */
    .t-PNC {
      background: #ADD8E6;
      color: #000;
      font-weight: 700;
    }

    .t-PNIT {
      background: #FFFFE0;
      color: #000;
      font-weight: 700;
    }

    .t-DGT {
      background: #E0FFE0;
      color: #000;
      font-weight: 700;
    }

    .t-BCT {
      background: #FFE4E1;
      color: #000;
      font-weight: 700;
    }

    .t-HJNC {
      background: #F0E68C;
      color: #000;
      font-weight: 700;
    }

    .t-HPNT {
      background: #E6E6FA;
      color: #000;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-icon">📦</div>
    <div class="title-wrap">
      <h1>ITPS Inbound Converter <span style="font-size:0.6em;vertical-align:middle;opacity:.7;">(Serverless
          v2.0)</span></h1>
      <p class="copyright">The End – YS KIM holds the copyright @ 2026</p>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <p class="section-title">파일 업로드 (Drag &amp; Drop)</p>

      <div class="drop-grid">
        <!-- 최종파일 (TSTEAM) -->
        <div class="drop-zone tsteam" id="zone-tsteam" onclick="document.getElementById('file-tsteam').click()"
          ondragover="onDragOver(event,'tsteam')" ondragleave="onDragLeave('tsteam')" ondrop="onDrop(event,'tsteam')">
          <button class="clear-btn" id="clear-tsteam" onclick="clearFile('tsteam',event)">✕ 제거</button>
          <div class="drop-icon">📊</div>
          <span class="drop-label">최종파일</span>

          <div class="drop-filename" id="name-tsteam"></div>
          <input type="file" id="file-tsteam" accept=".xlsx,.xls" onchange="onFileInput('tsteam',this)" />
        </div>

        <!-- ITPS 파일 -->
        <div class="drop-zone itps" id="zone-itps" onclick="document.getElementById('file-itps').click()"
          ondragover="onDragOver(event,'itps')" ondragleave="onDragLeave('itps')" ondrop="onDrop(event,'itps')">
          <button class="clear-btn" id="clear-itps" onclick="clearFile('itps',event)">✕ 제거</button>
          <div class="drop-icon">📋</div>
          <span class="drop-label">ITPS 파일</span>

          <div class="drop-filename" id="name-itps"></div>
          <input type="file" id="file-itps" accept=".xlsx,.xls" onchange="onFileInput('itps',this)" />
        </div>
      </div>



      <div class="action-bar">
        <button class="process-btn" id="process-btn" onclick="processFiles()" disabled>
          <div class="spinner" id="spinner"></div>
          <span id="btn-text">Merged 파일 생성</span>
        </button>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <div class="neon-divider"></div>

    <div class="right-panel" id="summary-panel">
      <div class="empty-state">파일을 업로드하고 생성 버튼을 누르면 브라우저 내에서 즉시 처리됩니다.</div>
    </div>
  </main>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // 0. 상수 정의

    // ═══════════════════════════════════════════════════════════════════
    // 1. 파일 상태 관리
    // ═══════════════════════════════════════════════════════════════════
    const files = { tsteam: null, itps: null };

    function setFile(type, file) {
      files[type] = file;
      const zone = document.getElementById(`zone-${type}`);
      const nameEl = document.getElementById(`name-${type}`);
      zone.classList.add('loaded');
      nameEl.textContent = '✓ ' + file.name;
      nameEl.style.display = 'block';
      checkReady();
    }

    function clearFile(type, e) {
      if (e) e.stopPropagation();
      files[type] = null;
      document.getElementById(`zone-${type}`).classList.remove('loaded');
      const nameEl = document.getElementById(`name-${type}`);
      nameEl.textContent = '';
      nameEl.style.display = 'none';
      checkReady();
    }

    function checkReady() {
      document.getElementById('process-btn').disabled = !(files.tsteam && files.itps);
    }

    // ── drag & drop helpers ──
    function onDragOver(e, type) { e.preventDefault(); document.getElementById(`zone-${type}`).style.borderColor = type === 'tsteam' ? '#1f6feb' : '#238636'; }
    function onDragLeave(type) { document.getElementById(`zone-${type}`).style.borderColor = ''; }
    function onDrop(e, type) {
      e.preventDefault();
      document.getElementById(`zone-${type}`).style.borderColor = '';
      const f = e.dataTransfer.files[0];
      if (f && (f.name.endsWith('.xlsx') || f.name.endsWith('.xls'))) setFile(type, f);
      else showToast('error', '❌ Excel 파일(.xlsx/.xls)만 업로드 가능합니다.');
    }
    function onFileInput(type, input) {
      if (input.files[0]) setFile(type, input.files[0]);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 2. Excel 읽기
    // ═══════════════════════════════════════════════════════════════════
    function readExcel(file) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
            res(wb);
          } catch (err) { rej(err); }
        };
        reader.onerror = rej;
        reader.readAsArrayBuffer(file);
      });
    }

    function sheetToJson(sheet) {
      return XLSX.utils.sheet_to_json(sheet, { defval: '' });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 3. 유틸리티
    // ═══════════════════════════════════════════════════════════════════
    function convertToPortCode(portName) {
      if (!portName) return '';
      const key = String(portName).trim().toUpperCase();
      return PORT_CODE_MAP[key] || '';
    }

    function mapTerminal(name) {
      if (!name) return '';
      const s = String(name).trim();
      for (const [full, abbr] of Object.entries(TERMINAL_MAP)) {
        if (s.includes(full)) return abbr;
      }
      return s;
    }

    function normStr(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }

    // BL No 통일: 'BL No.<Booking No.>', 'BL No.', 'BL.<Booking No.>', 'BL.No.<Booking No.>'
    function extractBL(row) {
      const candidates = ['BL No.<Booking No.>', 'BL No.', 'BL.<Booking No.>', 'BL.No.<Booking No.>'];
      for (const c of candidates) {
        if (row[c] !== undefined && row[c] !== '') {
          let v = String(row[c]);
          if (v.includes('<')) v = v.split('<')[0].trim();
          return v;
        }
      }
      return '';
    }

      const tsMap = {}; // { cntrNo: { POR, POL, POD, FPOD, REMARK } }
      for (const sheetName of tsteamWb.SheetNames) {
        const rows = sheetToJson(tsteamWb.Sheets[sheetName]);
        if (rows.length === 0) continue;
        const hasCntr = 'Cntr No.' in rows[0] || 'Container Number' in rows[0];
        if (!hasCntr) continue;

        rows.forEach(r => {
          const cntrKey = 'Cntr No.' in r ? 'Cntr No.' : 'Container Number';
          const cntr = normStr(r[cntrKey]);
          if (!cntr) return;
          tsMap[cntr] = {
            POR: normStr(r['POR'] || r['POL'] || ''),
            POL: normStr(r['POL'] || ''),
            POD: normStr(r['POD'] || ''),
            FPOD: normStr(r['FPOD'] || r['FND'] || ''),
            REMARK: normStr(r['REMARK'] || ''),
          };
        });
      }

      // ── Step 4: ITPS 데이터 매핑 ────────────────────────────────────
      let data = itpsData.map(row => {
        const r = Object.assign({}, row);
        const cntr = normStr(r['Equipment Number']);
        const ts = tsMap[cntr];

        if (ts) {
          r['Origin Load Port'] = ts.POR;
          r['Next POD'] = ts.POD;
          // Discharge Port 변환
          let dp = normStr(r['Discharge Port']);
          if (dp) {
            let parts = dp.split(',');
            let portName = (parts.length > 1 ? parts.slice(0, -1).join(',') : parts[0]).trim();
            const code = convertToPortCode(portName);
            if (code) r['Discharge Port'] = code;
          }
          r['Active'] = ts.REMARK;
        }
        return r;
      });

      // ── Step 5: VGM Weight 처리 ─────────────────────────────────────
      data = data.map(r => {
        if (r['Weight'] !== undefined && r['Weight'] !== '') {
          const w = parseFloat(r['Weight']);
          r['Weight'] = isNaN(w) ? 0 : Math.round(w);
        }

        let vgm = parseFloat(r['VGM Weight']);
        if (isNaN(vgm) || r['VGM Weight'] === '') {
          vgm = parseFloat(r['Weight']) || 0;
        } else {
          vgm = Math.round(vgm);
        }

        let vgmUnit = normStr(r['VGM Unit']) || 'KGS';
        if (vgmUnit.toUpperCase() === 'LBS') {
          vgm = Math.round(vgm * 0.453592);
          vgmUnit = 'KGS (from LBS)';
        }
        r['VGM Weight'] = vgm;
        r['VGM Unit'] = vgmUnit;
        return r;
      });



      // ── Step 7: L/T 분류 ─────────────────────────────────────────────
      data = data.map(r => {
        const fe = normStr(r['Full/Empty']).toUpperCase();
        if (fe !== 'E') {
          const dp = normStr(r['Discharge Port']);
          r['L/T'] = KR_PORTS.includes(dp) ? dp : 'TS';
        } else {
          r['L/T'] = null;
        }
        return r;
      });

      // ── Step 9: 터미널 이름 매핑 ────────────────────────────────────
      data = data.map(r => {
        if (r['Loading Terminal']) r['Loading Terminal'] = mapTerminal(r['Loading Terminal']);
        if (r['Discharging Terminal']) r['Discharging Terminal'] = mapTerminal(r['Discharging Terminal']);
        return r;
      });

      // ── Step 10: 정렬 (Loading Terminal 기준, 빈 값 하순) ────────────
      data.sort((a, b) => {
        const ta = normStr(a['Loading Terminal']);
        const tb = normStr(b['Loading Terminal']);
        if (!ta && !tb) return 0;
        if (!ta) return 1;
        if (!tb) return -1;
        return ta.localeCompare(tb);
      });

      // ── Step 11: 컬럼 이름 변경 & 비고 처리 ─────────────────────────
      data = data.map(r => {
        if ('Next POD' in r) { r['Stow Code'] = r['Next POD']; delete r['Next POD']; }
        if ('Active' in r) { r['Remark'] = r['Active']; delete r['Active']; }
        if (!('Remark' in r)) r['Remark'] = '';
        r['Remark'] = normStr(r['Remark']).replace(/^nan$/i, '').replace(/^None$/i, '');

        const imo = normStr(r['IMO Class']).replace(/^nan$/i, '').replace(/^None$/i, '');
        r['IMO Class'] = imo;

        // add_remarks
        const reefer = r['Reefer Temp.'];
        const hasReefer = reefer !== undefined && reefer !== '' && reefer !== null;
        const isCriticalIMO = ['2', '2.1', '2.2'].includes(imo);
        let remark = r['Remark'] || '';
        if (isCriticalIMO || (imo && hasReefer)) {
          if (!remark.includes('직반출 위험물')) remark = (remark + ' 직반출 위험물').trim();
        }
        const socVal = normStr(r['SOC']).toUpperCase();
        if (socVal === 'Y') {
          if (!remark.includes('SOC')) remark = (remark + ' SOC').trim();
        }
        r['Remark'] = remark;

        // BL 컬럼 통일
        r['BL No.<Booking No.>'] = extractBL(r);
        return r;
      });

      return data;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 5. SUMMARY 생성 (app.py Step 8)
    // ═══════════════════════════════════════════════════════════════════
    function generateSummaries(data) {
      const counts = {}; // { typeSize: { KRPUS, KRKAN, KRINC, TS, Empty, TOTAL } }
      const socRows = [];
      const dgRows = [];

      data.forEach(r => {
        const ts = normStr(r['Type/Size']);
        const lt = r['L/T'];
        const fe = normStr(r['Full/Empty']).toUpperCase();
        const rem = normStr(r['Remark']);

        if (!counts[ts]) counts[ts] = { KRPUS: 0, KRKAN: 0, KRINC: 0, TS: 0, Empty: 0, TOTAL: 0, 'TYPE/SIZE': ts };

        if (fe === 'E') {
          counts[ts]['Empty']++;
        } else {
          if (lt && KR_PORTS.includes(lt)) counts[ts][lt]++;
          else if (lt === 'TS') counts[ts]['TS']++;
        }
        counts[ts]['TOTAL']++;

        if (rem.includes('SOC')) socRows.push(r);
        if (rem.includes('직반출 위험물')) dgRows.push(r);
      });

      const summary = Object.values(counts);
      // 합계 행
      const totals = { 'TYPE/SIZE': 'Total', KRPUS: 0, KRKAN: 0, KRINC: 0, TS: 0, Empty: 0, TOTAL: 0 };
      summary.forEach(s => ['KRPUS', 'KRKAN', 'KRINC', 'TS', 'Empty', 'TOTAL'].forEach(k => totals[k] += s[k]));
      summary.push(totals);

      // 컬럼 순서: KRPUS, KRKAN, KRINC, TS, Empty, TOTAL, TYPE/SIZE
      const orderedSummary = summary.map(s => ({
        'KRPUS': s.KRPUS, 'KRKAN': s.KRKAN, 'KRINC': s.KRINC,
        'TS': s.TS, 'Empty': s.Empty, 'TOTAL': s.TOTAL, 'TYPE/SIZE': s['TYPE/SIZE']
      }));

      return { summary: orderedSummary, soc: socRows, dg: dgRows, flows: buildFlows(data) };
    }

    // 터미널 간 이동 플로우 집계
    function buildFlows(data) {
      const flowMap = {};
      data.forEach(r => {
        const dis = normStr(r['Discharging Terminal']);
        const load = normStr(r['Loading Terminal']);
        const fe = normStr(r['Full/Empty']).toUpperCase();
        if (!dis || !load || fe === 'E') return; // Empty 제외
        const key = `${dis}|||${load}`;
        const ts = normStr(r['Type/Size']);
        const teu = ts.startsWith('4') ? 2 : 1; // 40ft = 2 TEU, 20ft = 1 TEU
        if (!flowMap[key]) flowMap[key] = { dis, load, boxes: 0, teu: 0 };
        flowMap[key].boxes++;
        flowMap[key].teu += teu;
      });
      return Object.values(flowMap).sort((a, b) => b.boxes - a.boxes);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 6. Excel 다운로드 (app.py Step 15)
    // ═══════════════════════════════════════════════════════════════════
    function buildOutputRows(data) {
      return data.map(r => {
        const out = {};
        OUTPUT_COLUMNS.forEach(col => {
          let v = r[col];
          if (v === undefined || v === null || v === 'nan' || v === 'None') v = '';
          out[col] = v;
        });
        return out;
      });
    }

    // 컬럼 데이터 기반 자동 너비 계산
    function autoColWidths(headers, rows) {
      return headers.map(col => {
        let maxLen = col.length;
        rows.forEach(r => {
          const v = r[col] !== undefined && r[col] !== null ? String(r[col]) : '';
          if (v.length > maxLen) maxLen = v.length;
        });
        return { wch: Math.min(maxLen + 3, 60) };
      });
    }

    // 헤더 행 스타일(회색 배경 + 볼드)
    function applyHeaderStyle(ws) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let c = range.s.c; c <= range.e.c; c++) {
        const cellRef = XLSX.utils.encode_cell({ r: 0, c: c });
        const cell = ws[cellRef];
        if (cell) {
          cell.s = {
            fill: { patternType: 'solid', fgColor: { rgb: 'DDDDDD' } },
            font: { bold: true },
            alignment: { horizontal: 'center', vertical: 'center' }
          };
        }
      }
    }

    function downloadExcel(data, summaryData, socRows, dgRows, filename) {
      const wb = XLSX.utils.book_new();

      // ── ITPS_DATA 시트 ────────────────────────────────────
      const outputRows = buildOutputRows(data);
      const ws_itps = XLSX.utils.json_to_sheet(outputRows, { header: OUTPUT_COLUMNS });

      // 컬럼 너비 자동 조정
      const colWidths = OUTPUT_COLUMNS.map(col => {
        let maxLen = col.length;
        outputRows.forEach(r => { const l = String(r[col] ?? '').length; if (l > maxLen) maxLen = l; });
        return { wch: Math.min(maxLen + 2, 50) };
      });
      ws_itps['!cols'] = colWidths;

      // 헤더 스타일 적용
      applyHeaderStyle(ws_itps);

      // 터미널 셀 배경색 (Loading Terminal / Discharging Terminal)
      const loadColIdx = OUTPUT_COLUMNS.indexOf('Loading Terminal');
      const disColIdx = OUTPUT_COLUMNS.indexOf('Discharging Terminal');
      const range = XLSX.utils.decode_range(ws_itps['!ref']);
      for (let r = range.s.r + 1; r <= range.e.r; r++) {
        [loadColIdx, disColIdx].forEach(ci => {
          if (ci < 0) return;
          const cellRef = XLSX.utils.encode_cell({ r, c: ci });
          const cell = ws_itps[cellRef];
          if (cell && cell.v && TERMINAL_COLORS[cell.v]) {
            cell.s = {
              fill: { patternType: 'solid', fgColor: { rgb: TERMINAL_COLORS[cell.v] } },
              font: { bold: true },
              alignment: { horizontal: 'center' }
            };
          }
        });
      }
      XLSX.utils.book_append_sheet(wb, ws_itps, 'ITPS_DATA');

      // ── SUMMARY 시트 ──────────────────────────────────────
      const summaryHeader = ['KRPUS', 'KRKAN', 'KRINC', 'TS', 'Empty', 'TOTAL', 'TYPE/SIZE'];
      const ws_sum = XLSX.utils.json_to_sheet(summaryData, { header: summaryHeader });
      ws_sum['!cols'] = autoColWidths(summaryHeader, summaryData);
      applyHeaderStyle(ws_sum);
      XLSX.utils.book_append_sheet(wb, ws_sum, 'SUMMARY');

      // ── SOC 시트 ─────────────────────────────────────────
      const socCols = ['BL No.<Booking No.>', 'Equipment Number', 'Origin Load Port', 'Discharge Port', 'Full/Empty', 'Type/Size'];
      const socData = socRows.map(r => { const o = {}; socCols.forEach(c => o[c] = normStr(r[c])); return o; });
      const ws_soc = XLSX.utils.json_to_sheet(socData, { header: socCols });
      ws_soc['!cols'] = autoColWidths(socCols, socData);
      applyHeaderStyle(ws_soc);
      XLSX.utils.sheet_add_aoa(ws_soc, [['Total', '', '', '', '', socRows.length]], { origin: -1 });
      XLSX.utils.book_append_sheet(wb, ws_soc, 'SOC');

      // ── 직반출 위험물 시트 ──────────────────────────────────
      const dgCols = ['BL No.<Booking No.>', 'Equipment Number', 'Full/Empty', 'Origin Load Port', 'Discharge Port', 'IMO Class', 'UN Number', 'Reefer Temp.'];
      const dgData = dgRows.map(r => { const o = {}; dgCols.forEach(c => o[c] = normStr(r[c])); return o; });
      const ws_dg = XLSX.utils.json_to_sheet(dgData, { header: dgCols });
      ws_dg['!cols'] = autoColWidths(dgCols, dgData);
      applyHeaderStyle(ws_dg);
      XLSX.utils.sheet_add_aoa(ws_dg, [['Total', '', '', '', '', '', '', dgRows.length]], { origin: -1 });
      XLSX.utils.book_append_sheet(wb, ws_dg, '직반출 위험물');

      // ── 다운로드 ───────────────────────────────────────────
      XLSX.writeFile(wb, filename);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 7. 메인 실행
    // ═══════════════════════════════════════════════════════════════════
    async function processFiles() {
      const btn = document.getElementById('process-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = '[데이터 처리중]';
      showToast('success', '⏳ 브라우저 내 데이터 처리 중...');

      try {
        // 파일 읽기
        const [tsteamWb, itpsWb] = await Promise.all([
          readExcel(files.tsteam),
          readExcel(files.itps),
        ]);

        // ITPS 파일: 'Data' 시트 우선, 없으면 첫 번째 시트
        const itpsSheetName = itpsWb.SheetNames.includes('Data') ? 'Data' : itpsWb.SheetNames[0];
        const itpsData = sheetToJson(itpsWb.Sheets[itpsSheetName]);

        if (itpsData.length === 0) throw new Error('ITPS 파일에 데이터가 없습니다.');

        // 처리
        const merged = performProcessing(tsteamWb, itpsData);
        const { summary, soc, dg } = generateSummaries(merged);

        // 파일명 생성 (최종파일 - XXX → XXX merged file.xlsx)
        let baseName = files.tsteam.name.replace(/\.[^.]+$/, '');
        baseName = baseName.replace(/^최종파일\s*-\s*/i, '').trim();
        const filename = `${baseName} merged file.xlsx`;

        // 다운로드
        downloadExcel(merged, summary, soc, dg, filename);

        // UI 렌더링
        renderSummary({ summary, soc, dg, flows: buildFlows(merged) });

        showToast('success', `✅ 처리 완료! "${filename}" 다운로드가 시작됩니다.`);
      } catch (err) {
        console.error(err);
        showToast('error', '❌ 오류: ' + err.message);
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Merged 파일 생성';
        checkReady();
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 8. UI 렌더링
    // ═══════════════════════════════════════════════════════════════════
    function renderSummary({ summary, soc, dg, flows }) {
      const panel = document.getElementById('summary-panel');
      panel.innerHTML = '';

      // 터미널 플로우 카드
      if (flows && flows.length > 0) {
        panel.appendChild(createFlowCard(flows));
      }

      panel.appendChild(createCard('📊 SUMMARY 정보', summary, null, true));

      const dgCols = ['BL No.<Booking No.>', 'Equipment Number', 'Full/Empty', 'Origin Load Port', 'Discharge Port', 'IMO Class', 'UN Number', 'Reefer Temp.'];
      panel.appendChild(createCard('⚠️ 직반출 위험물 목록', dg, dg.length, false, dgCols));

      const socCols = ['BL No.<Booking No.>', 'Equipment Number', 'Origin Load Port', 'Discharge Port', 'Full/Empty', 'Type/Size'];
      panel.appendChild(createCard('👥 SOC 목록', soc, soc.length, false, socCols));
    }

    // 터미널 플로우 시각화 카드 (A -> B,C,D,E 트리 스타일)
    function createFlowCard(flows) {
      if (!flows || flows.length === 0) return document.createElement('div');

      const card = document.createElement('div');
      card.className = 'summary-card flow-card';

      const h2 = document.createElement('h2');
      h2.innerHTML = '🔄 터미널간 컨테이너 이동 현황 (Divergent Flow)';
      card.appendChild(h2);

      // 데이터 그룹화 (Discharge 기준)
      const groups = {};
      flows.forEach(f => {
        if (!groups[f.dis]) groups[f.dis] = [];
        groups[f.dis].push(f);
      });

      const container = document.createElement('div');
      container.className = 'flow-container';

      Object.entries(groups).forEach(([dis, dests]) => {
        const groupEl = document.createElement('div');
        groupEl.className = 'flow-group';

        // 1. Source (Left)
        const sourceSide = document.createElement('div');
        sourceSide.className = 'source-side';
        const disColor = TERMINAL_COLORS[dis] || 'C8D6E8';
        sourceSide.innerHTML = `
          <div class="flow-node" style="background:#${disColor};">
            <div class="node-label">DISCHARGE</div>
            <div class="node-name">${dis}</div>
          </div>
        `;
        groupEl.appendChild(sourceSide);

        // 2. SVG Area (Center)
        const svgSide = document.createElement('div');
        svgSide.className = 'svg-side';
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.style.position = "absolute";
        svg.style.left = "0";
        svg.style.top = "0";
        svg.setAttribute("overflow", "visible");
        svgSide.appendChild(svg);
        groupEl.appendChild(svgSide);

        // 3. Destination (Right)
        const destSide = document.createElement('div');
        destSide.className = 'destination-side';
        dests.forEach(d => {
          const loadColor = TERMINAL_COLORS[d.load] || 'C8E6C8';
          const dWrap = document.createElement('div');
          dWrap.className = 'dest-node-wrap';
          dWrap.innerHTML = `
            <div class="flow-node" style="background:#${loadColor};">
              <div class="node-label">LOAD</div>
              <div class="node-name">${d.load}</div>
            </div>
            <div class="dest-info">
              <span class="dest-boxes">${d.boxes} containers</span>
              <span class="dest-teu">${d.teu} TEU</span>
            </div>
          `;
          destSide.appendChild(dWrap);
        });
        groupEl.appendChild(destSide);
        container.appendChild(groupEl);

        // Wait for rendering to calculate positions and draw paths
        setTimeout(() => {
          const disNode = sourceSide.querySelector('.flow-node');
          const disRect = disNode.getBoundingClientRect();
          const svgRect = svg.getBoundingClientRect();

          const x1 = 0; // Relative to SVG left
          const y1 = (disRect.top + disRect.height / 2) - svgRect.top;

          destSide.querySelectorAll('.dest-node-wrap').forEach((dWrap, i) => {
            const destNode = dWrap.querySelector('.flow-node');
            const destRect = destNode.getBoundingClientRect();

            const x2 = svgRect.width;
            const y2 = (destRect.top + destRect.height / 2) - svgRect.top;

            // Bezier Path (Static background)
            const pathData = `M ${x1} ${y1} C ${x1 + (x2 - x1) / 2} ${y1}, ${x1 + (x2 - x1) / 2} ${y2}, ${x2} ${y2}`;
            const pathBG = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathBG.setAttribute("d", pathData);
            pathBG.setAttribute("class", "flow-path");
            svg.appendChild(pathBG);

            // Bezier Path (Animated flow)
            const pathAnim = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathAnim.setAttribute("d", pathData);
            pathAnim.setAttribute("class", "flow-path-anim");
            svg.appendChild(pathAnim);

            // Moving Light (Glow dot)
            const light = document.createElement('div');
            light.className = 'moving-light';
            light.style.setProperty('--path', `path('${pathData}')`);
            light.style.animationDelay = `${i * 0.5}s`;
            svgSide.appendChild(light);
          });
        }, 100);
      });

      card.appendChild(container);
      return card;
    }

    function createCard(title, data, count, isSummary = false, specificKeys = null) {
      const card = document.createElement('div'); card.className = 'summary-card';
      const h2 = document.createElement('h2');
      h2.innerHTML = `${title}${count !== null && count !== undefined ? ` <span class="header-count">(${count}건)</span>` : ''}`;
      card.appendChild(h2);

      if (!data || data.length === 0) {
        card.innerHTML += '<p class="empty-state">데이터가 없습니다.</p>';
        return card;
      }

      let keys = [];
      if (isSummary) {
        keys = ['KRPUS', 'KRKAN', 'KRINC', 'TS', 'Empty', 'TOTAL', 'TYPE/SIZE'];
      } else if (specificKeys) {
        keys = specificKeys;
      } else {
        // 내부 필드(_,L/T,SOC 등) 제외
        const excludeKeys = new Set(['L/T', 'SOC', '_terminal']);
        keys = Object.keys(data[0]).filter(k => !k.startsWith('_') && !excludeKeys.has(k));
      }

      const wrap = document.createElement('div'); wrap.className = 'table-container';
      const table = document.createElement('table');

      // thead
      const thead = document.createElement('thead');
      const trH = document.createElement('tr');
      keys.forEach(k => {
        const th = document.createElement('th');
        th.textContent = k;
        if (isSummary) {
          if (k === 'KRPUS') th.className = 'col-krpus';
          if (k === 'KRKAN') th.className = 'col-krkan';
          if (k === 'KRINC') th.className = 'col-krinc';
        }
        trH.appendChild(th);
      });
      thead.appendChild(trH); table.appendChild(thead);

      // tbody
      const tbody = document.createElement('tbody');
      data.forEach(row => {
        const tr = document.createElement('tr');
        const isTotal = Object.values(row).some(v => String(v).toLowerCase() === 'total');
        if (isTotal) tr.className = 'total-row';

        keys.forEach(k => {
          const td = document.createElement('td');
          const val = row[k];
          // 요약 정보(isSummary)에서 0은 빈칸으로 표시하여 가독성 향상
          const isZero = (val === 0 || val === '0');
          td.textContent = (val === null || val === undefined || val === '' || (isSummary && isZero)) ? '' : val;

          if (isSummary) {
            if (k === 'KRPUS') td.className = 'col-krpus';
            if (k === 'KRKAN') td.className = 'col-krkan';
            if (k === 'KRINC') td.className = 'col-krinc';
          }
          // 터미널 색상 (상세 목록)
          if (!isSummary && k === 'Loading Terminal' && TERMINAL_COLORS[val]) {
            td.style.background = `#${TERMINAL_COLORS[val]}`;
            td.style.color = '#000';
            td.style.fontWeight = '700';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table); card.appendChild(wrap);
      return card;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 9. Toast
    // ═══════════════════════════════════════════════════════════════════
    function showToast(type, msg) {
      const el = document.getElementById('toast');
      el.className = 'toast show ' + type;
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.classList.remove('show'); }, 6000);
    }
  </script>
</body>
